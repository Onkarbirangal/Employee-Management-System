{% extends "base.html" %}
{% block title %}Delete Department - EMS Portal{% endblock %}

{% block content %}
<div class="container-fluid max-w-700 py-4 text-center">
    <div class="card shadow-sm border-0 border-top border-danger border-4">
        <div class="card-body p-5">
            <div class="text-danger mb-3">
                <i class="bi bi-exclamation-triangle fs-1"></i>
            </div>
            <h4 class="fw-bold">Delete Department?</h4>
            <p class="text-muted mb-4">
                Are you sure you want to delete <strong>"{{ department.name }}"</strong>?<br>
                Assigned staff members will be preserved and marked as unassigned.
            </p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'department_list' %}" class="btn btn-light px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete Department</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
