{% extends "base.html" %}
{% block title %}500 - Internal Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="display-1 text-warning fw-bold"><i class="bi bi-gear-wide-connected"></i> 500</div>
    <h2 class="mt-3 fw-bold">Server Error</h2>
    <p class="text-muted lead">An unexpected error occurred on the server. Please try again shortly.</p>
    <a href="{% url 'login_redirect' %}" class="btn btn-outline-secondary px-4 py-2 mt-3">
        <i class="bi bi-arrow-clockwise me-2"></i>Try Again
    </a>
</div>
{% endblock %}
