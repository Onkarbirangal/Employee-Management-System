{% extends "base.html" %}
{% block title %}403 Forbidden - Access Denied{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="display-1 text-danger fw-bold"><i class="bi bi-shield-slash"></i> 403</div>
    <h2 class="mt-3 fw-bold">Access Denied</h2>
    <p class="text-muted lead">You do not have permission to view or modify this resource.</p>
    <a href="{% url 'login_redirect' %}" class="btn btn-primary px-4 py-2 mt-3">
        <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
    </a>
</div>
{% endblock %}
