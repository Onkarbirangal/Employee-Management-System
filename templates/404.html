{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="display-1 text-secondary fw-bold"><i class="bi bi-question-circle"></i> 404</div>
    <h2 class="mt-3 fw-bold">Page Not Found</h2>
    <p class="text-muted lead">The page you are looking for might have been removed or does not exist.</p>
    <a href="{% url 'login_redirect' %}" class="btn btn-primary px-4 py-2 mt-3">
        <i class="bi bi-house-door me-2"></i>Go to Home
    </a>
</div>
{% endblock %}
